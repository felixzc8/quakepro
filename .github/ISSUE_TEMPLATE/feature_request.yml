name: Feature request
description: Suggest an improvement.
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe desired behavior and alternatives considered.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Add mockups, examples, or links if useful. Do not share private transcripts.
